blockExoticSubdeps: false

allowBuilds:
  classic-level: true
  esbuild: true

# Used when this repo is built standalone. Inside the investigator-fvtt
# monorepo, pnpm ignores this file and uses the root catalog instead, so keep
# these in step with it.
catalog:
  '@types/react': ^19.3.0
  '@vitejs/plugin-react': 6.1.2
  fvtt-types: 14.366.0-beta.20261009164208
  happy-dom: ^21.0.4
  # plugin-react 6.1 wants ^0.152.0, which for 0.x means 0.152 only
  oxc-transform-react: 0.152.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsx: ^4.23.15
  typescript: 7.0.2
  vite: 8.3.5
  vitest: ^3.2.4

# Force one copy of each (e.g. vitest 3 would otherwise bring its own vite).
overrides:
  '@types/react': 'catalog:'
  '@vitejs/plugin-react': 'catalog:'
  fvtt-types: 'catalog:'
  happy-dom: 'catalog:'
  oxc-transform-react: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  tsx: 'catalog:'
  typescript: 'catalog:'
  vite: 'catalog:'
  vitest: 'catalog:'
